name: Bug report
description: Report a reproducible problem without private data or secrets.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value:
        'For security vulnerabilities, use SECURITY.md. Do not include tokens or personal notes.'
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior using synthetic data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and redacted diagnostics
      description: OS, relevant components and safe error messages.

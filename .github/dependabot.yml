version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /desktop/editor
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:15'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: Europe/Rome
    open-pull-requests-limit: 5

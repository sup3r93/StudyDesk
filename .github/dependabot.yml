# Add application ecosystems only when their actual manifests exist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      tooling-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5

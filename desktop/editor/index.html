<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>StudyDesk</title>
  </head>
  <body>
    <main id="app">
      <div id="toolbar" role="toolbar"></div>
      <div id="notice" role="status"></div>
      <div id="paper-scroll" tabindex="0">
        <div id="paper-stage">
          <div id="sheets" aria-hidden="true"></div>
          <div id="editor"></div>
        </div>
      </div>
      <footer id="paper-status" aria-live="polite"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
